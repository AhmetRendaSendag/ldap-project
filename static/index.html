<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>LDAP Kullanıcı Yönetimi</title>
<style>
  body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f4; }
  h1 { color: #333; }
  table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
  th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
  th { background: #333; color: white; }
  input, button { padding: 8px; margin: 4px 0; }
  #loginBox, #addBox { background: white; padding: 15px; margin-bottom: 15px; border-radius: 6px; }
  .error { color: red; }
  .success { color: green; }
</style>
</head>
<body>

<h1>LDAP Kullanıcı Yönetimi</h1>

<div id="loginBox">
  <h3>Giriş Bilgileri</h3>
  <input type="text" id="username" placeholder="Kullanıcı adı (örn: admin)">
  <input type="password" id="password" placeholder="Şifre">
  <button onclick="loadUsers()">Bağlan ve Listele</button>
  <p id="loginStatus"></p>
</div>

<div id="addBox">
  <h3>Yeni Kullanıcı Ekle</h3>
  <input type="text" id="newCn" placeholder="cn (örn: ali.veli)">
  <input type="text" id="newSn" placeholder="sn (soyad)">
  <input type="text" id="newUid" placeholder="uid">
  <input type="text" id="newOu" placeholder="ou (örn: IT)">
  <input type="password" id="newPassword" placeholder="Şifre">
  <button onclick="addUser()">Ekle</button>
  <p id="addStatus"></p>
</div>

<table id="userTable">
  <thead>
    <tr><th>cn</th><th>sn</th><th>uid</th><th>ou</th><th>İşlemler</th></tr>
  </thead>
  <tbody id="userTableBody"></tbody>
</table>

<script>
function getAuthHeader() {
  const user = document.getElementById('username').value;
  const pass = document.getElementById('password').value;
  return "Basic " + btoa(user + ":" + pass);
}

async function loadUsers() {
  const status = document.getElementById('loginStatus');
  status.textContent = "Yükleniyor...";
  status.className = "";
  try {
    const response = await fetch('/users', {
      headers: { "Authorization": getAuthHeader() }
    });
    if (!response.ok) {
      const err = await response.json();
      status.textContent = "Hata: " + (err.detail || response.status);
      status.className = "error";
      return;
    }
    const data = await response.json();
    renderUsers(data.users);
    status.textContent = "Bağlantı başarılı.";
    status.className = "success";
  } catch (e) {
    status.textContent = "Bağlantı hatası: " + e;
    status.className = "error";
  }
}

function renderUsers(users) {
  const body = document.getElementById('userTableBody');
  body.innerHTML = "";
  users.forEach(u => {
    const row = document.createElement('tr');

    const cnCell = document.createElement('td');
    cnCell.textContent = u.cn;
    row.appendChild(cnCell);

    const snCell = document.createElement('td');
    const snInput = document.createElement('input');
    snInput.type = 'text';
    snInput.id = 'sn-' + u.uid;
    snInput.value = u.sn;
    snCell.appendChild(snInput);
    row.appendChild(snCell);

    const uidCell = document.createElement('td');
    uidCell.textContent = u.uid;
    row.appendChild(uidCell);

    const ouCell = document.createElement('td');
    const ouInput = document.createElement('input');
    ouInput.type = 'text';
    ouInput.id = 'ou-' + u.uid;
    ouInput.value = u.ou || '';
    ouCell.appendChild(ouInput);
    row.appendChild(ouCell);

    const actionsCell = document.createElement('td');
    const updateBtn = document.createElement('button');
    updateBtn.textContent = 'Güncelle';
    updateBtn.addEventListener('click', () => updateUser(u.uid));
    const deleteBtn = document.createElement('button');
    deleteBtn.textContent = 'Sil';
    deleteBtn.addEventListener('click', () => deleteUser(u.uid));
    actionsCell.appendChild(updateBtn);
    actionsCell.appendChild(deleteBtn);
    row.appendChild(actionsCell);

    body.appendChild(row);
  });
}

async function addUser() {
  const status = document.getElementById('addStatus');
  const body = {
    cn: document.getElementById('newCn').value,
    sn: document.getElementById('newSn').value,
    uid: document.getElementById('newUid').value,
    ou: document.getElementById('newOu').value,
    password: document.getElementById('newPassword').value
  };
  try {
    const response = await fetch('/users', {
      method: 'POST',
      headers: {
        "Authorization": getAuthHeader(),
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });
    const data = await response.json();
    if (!response.ok) {
      status.textContent = "Hata: " + data.detail;
      status.className = "error";
      return;
    }
    status.textContent = data.message;
    status.className = "success";
    loadUsers();
  } catch (e) {
    status.textContent = "Hata: " + e;
    status.className = "error";
  }
}

async function updateUser(uid) {
  const sn = document.getElementById('sn-' + uid).value;
  const ou = document.getElementById('ou-' + uid).value;
  try {
    const response = await fetch('/users/' + uid, {
      method: 'PUT',
      headers: {
        "Authorization": getAuthHeader(),
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ sn: sn, ou: ou })
    });
    const data = await response.json();
    if (!response.ok) { alert("Hata: " + data.detail); return; }
    loadUsers();
  } catch (e) {
    alert("Hata: " + e);
  }
}

async function deleteUser(uid) {
  if (!confirm("Silmek istediğine emin misin? (" + uid + ")")) return;
  try {
    const response = await fetch('/users/' + uid, {
      method: 'DELETE',
      headers: { "Authorization": getAuthHeader() }
    });
    const data = await response.json();
    if (!response.ok) { alert("Hata: " + data.detail); return; }
    loadUsers();
  } catch (e) {
    alert("Hata: " + e);
  }
}
</script>

</body>
</html>
